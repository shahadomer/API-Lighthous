<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none" role="img" aria-label="Media and files category illustration">
  <rect width="400" height="300" rx="16" fill="#0B1730" />
  <!-- Media Frame Canvas -->
  <rect x="90" y="70" width="220" height="160" rx="14" fill="#2448D8" fill-opacity="0.15" stroke="#2448D8" stroke-width="2" />
  <!-- Waveform Audio Spectrogram -->
  <g stroke="#2448D8" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="135" x2="120" y2="165" />
    <line x1="135" y1="120" x2="135" y2="180" />
    <line x1="150" y1="110" x2="150" y2="190" />
    <line x1="165" y1="130" x2="165" y2="170" />
    <line x1="180" y1="140" x2="180" y2="160" />
    <line x1="220" y1="140" x2="220" y2="160" />
    <line x1="235" y1="125" x2="235" y2="175" />
    <line x1="250" y1="115" x2="250" y2="185" />
    <line x1="265" y1="130" x2="265" y2="170" />
    <line x1="280" y1="138" x2="280" y2="162" />
  </g>
  <!-- Key Accent Highlight: Central Media Processing Core & Play Action in Teal (#087F8C) -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="30" fill="#087F8C" fill-opacity="0.2" stroke="#087F8C" stroke-width="1.5" />
    <circle cx="0" cy="0" r="22" fill="#087F8C" />
    <!-- Play Triangle -->
    <polygon points="-4,-8 10,0 -4,8" fill="#F7F9FC" />
  </g>
  <!-- Codec / Container Header -->
  <rect x="110" y="90" width="45" height="12" rx="3" fill="#2448D8" opacity="0.6" />
  <rect x="165" y="90" width="30" height="12" rx="3" fill="#F7F9FC" opacity="0.2" />
  <!-- Media Streaming Timeline Scrubber -->
  <rect x="110" y="205" width="180" height="4" rx="2" fill="#2448D8" opacity="0.4" />
  <rect x="110" y="205" width="90" height="4" rx="2" fill="#087F8C" />
  <circle cx="200" cy="207" r="5" fill="#F7F9FC" />
</svg>

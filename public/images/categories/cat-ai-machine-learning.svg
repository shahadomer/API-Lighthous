<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none" role="img" aria-label="AI and machine learning category illustration">
  <rect width="400" height="300" rx="16" fill="#0B1730" />
  <!-- Grid Matrix Pattern -->
  <g opacity="0.15" stroke="#2448D8" stroke-width="1">
    <path d="M40 0v300M80 0v300M120 0v300M160 0v300M200 0v300M240 0v300M280 0v300M320 0v300M360 0v300" />
    <path d="M0 30h400M0 60h400M0 90h400M0 120h400M0 150h400M0 180h400M0 210h400M0 240h400M0 270h400" />
  </g>
  <!-- Geometric Neural Cluster Base -->
  <g stroke="#2448D8" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="120" y1="180" x2="200" y2="130" />
    <line x1="120" y1="120" x2="200" y2="130" />
    <line x1="200" y1="130" x2="280" y2="90" />
    <line x1="200" y1="130" x2="280" y2="170" />
    <line x1="200" y1="130" x2="200" y2="220" />
    <line x1="120" y1="180" x2="200" y2="220" />
    <line x1="200" y1="220" x2="280" y2="170" />
  </g>
  <!-- Passive Nodes -->
  <circle cx="120" cy="120" r="10" fill="#2448D8" />
  <circle cx="120" cy="180" r="8" fill="#2448D8" />
  <circle cx="280" cy="90" r="9" fill="#2448D8" />
  <circle cx="280" cy="170" r="11" fill="#2448D8" />
  <circle cx="200" cy="220" r="10" fill="#2448D8" />
  <!-- Central Pulse Ring -->
  <circle cx="200" cy="130" r="28" stroke="#087F8C" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />
  <!-- Key Accent Highlight: Core Intelligence Node in Teal (#087F8C) -->
  <circle cx="200" cy="130" r="18" fill="#087F8C" />
  <circle cx="200" cy="130" r="8" fill="#F7F9FC" />
  <!-- Geometric Data Vector -->
  <polygon points="190,122 210,130 190,138" fill="#0B1730" opacity="0.4" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none" role="img" aria-label="Travel and airline category illustration">
  <rect width="400" height="300" rx="16" fill="#0B1730" />
  <!-- Radar Sweep Coordinates -->
  <g opacity="0.15" stroke="#2448D8" stroke-width="1.5">
    <circle cx="200" cy="150" r="105" />
    <circle cx="200" cy="150" r="70" stroke-dasharray="6 6" />
    <line x1="200" y1="45" x2="200" y2="255" />
    <line x1="95" y1="150" x2="305" y2="150" />
  </g>
  <!-- Flight Trajectory Curve (Global Great Circle Arc) -->
  <path d="M100 210 Q 180 80 300 110" stroke="#2448D8" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="6 4" opacity="0.8" />
  <!-- Origin Airport Node -->
  <circle cx="100" cy="210" r="8" fill="#2448D8" stroke="#0B1730" stroke-width="2" />
  <circle cx="100" cy="210" r="3" fill="#F7F9FC" />
  <!-- Destination Airport Node -->
  <circle cx="300" cy="110" r="8" fill="#2448D8" stroke="#0B1730" stroke-width="2" />
  <circle cx="300" cy="110" r="3" fill="#F7F9FC" />
  <!-- Telemetry Position Marker (Key Accent Highlight: Teal #087F8C) -->
  <g transform="translate(205, 125)">
    <!-- Beacon Ping -->
    <circle cx="0" cy="0" r="22" stroke="#087F8C" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <circle cx="0" cy="0" r="14" fill="#087F8C" fill-opacity="0.3" />
    <!-- Geometric Supersonic Aircraft Silhouette -->
    <path d="M0 -12 L4 -4 L14 2 L4 4 L3 10 L0 8 L-3 10 L-4 4 L-14 2 L-4 -4 Z" fill="#087F8C" stroke="#F7F9FC" stroke-width="1" />
  </g>
  <!-- Altitude / Waypoint Tag -->
  <rect x="225" y="100" width="65" height="18" rx="4" fill="#2448D8" fill-opacity="0.3" stroke="#2448D8" stroke-width="1" />
  <line x1="233" y1="109" x2="275" y2="109" stroke="#F7F9FC" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>
